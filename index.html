<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ECB: Outbreak</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Roguelike zombie plague card game. Command the Expeditionary Combat Brigade and hold the world together until a cure is found.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Saira+Semi+Condensed:wght@400;500;600;700&family=Saira+Stencil+One&display=swap">
</head>
<body>
<style>
/* Layout: one-screen operations center — header strip, world map with overlays, brigade column, hand of orders along the bottom. Single deliberate dark theme. */
:root{
  color-scheme: dark;
  --bg:#0c1316; --panel:#121b1f; --panel2:#18242a; --raise:#1f2e35; --line:#2a3b42; --line2:#3a4f57;
  --ink:#dbe3dd; --dim:#8d9e99; --faint:#5f716c;
  --amber:#f0a53a; --amber-ink:#1a1206; --friend:#5cb6d4; --hostile:#e2483b; --good:#7fc28c; --warn:#e8c547;
  --ocean:#0a1114; --land:#2b3d3a; --fallen:#3d0e10;
  --t-combat:#e0683e; --t-fires:#e9a03d; --t-air:#5cb6d4; --t-intel:#a68de0; --t-research:#5fc4a8; --t-medical:#86c97f; --t-logistics:#c8b27b; --t-civil:#52b3aa; --t-command:#e8c547; --t-cure:#6fe0a0;
  --f-display:"Saira Stencil One", "Saira Semi Condensed", Impact, "Arial Narrow", sans-serif;
  --f-body:"Saira Semi Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r:6px;
}
*{box-sizing:border-box}
html,body,#root{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.4;overflow:hidden;
  background-image:radial-gradient(ellipse at 50% -20%, #16262c 0%, transparent 60%), repeating-linear-gradient(0deg, rgba(255,255,255,.012) 0 1px, transparent 1px 3px);}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.card:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.lbl{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:600}
b{color:#fff;font-weight:700}

#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}

/* header */
.hdr{display:flex;align-items:center;gap:18px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.brand .logo{font-family:var(--f-display);font-size:26px;letter-spacing:.04em;color:var(--amber);line-height:1}
.brand .sub{font-family:var(--f-display);font-size:15px;color:var(--ink);letter-spacing:.12em}
.week{display:flex;flex-direction:column;line-height:1.1}
.week .w{font-family:var(--f-mono);font-size:17px;font-weight:700}
.stats{display:flex;gap:16px;flex-wrap:wrap;flex:1;min-width:0}
.stat{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.stat .v{font-family:var(--f-mono);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.stat .v.bad{color:var(--hostile)} .stat .v.good{color:var(--good)}
.cure{display:flex;flex-direction:column;gap:3px;min-width:180px}
.cure .bar{height:10px;background:var(--panel2);border:1px solid var(--line2);border-radius:3px;overflow:hidden;position:relative}
.cure .bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#3e9d84,var(--t-research));transition:width .8s}
.cure .row{display:flex;justify-content:space-between;align-items:baseline}
.cure .row .mono{font-size:15px;font-weight:700;color:var(--t-research)}
.hbtn{background:transparent;border:1px solid var(--line2);border-radius:var(--r);padding:6px 10px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.hbtn:hover{color:var(--ink);border-color:var(--dim)}

/* main */
.main{display:grid;grid-template-columns:minmax(0,1fr) 360px;min-height:0}
.mapcol{position:relative;min-height:0;min-width:0;border-right:1px solid var(--line)}
.mapwrap{position:absolute;inset:0;overflow:hidden;background:var(--ocean)}
#map{width:100%;height:100%;display:block;touch-action:none;user-select:none}
#map .rg{stroke:#0b1214;stroke-width:.5;transition:fill .9s ease;cursor:pointer}
#map .rg:hover{stroke:#fff;stroke-width:.8}
#map .rg.sel{stroke:var(--amber);stroke-width:1.4}
#map .rg.theater{stroke:var(--friend);stroke-width:1.2}
#map .hatch{pointer-events:none}
#map .lab{pointer-events:none}
#map text{font-family:var(--f-body);pointer-events:none}
#map .rlabel{font-size:6.6px;font-weight:700;letter-spacing:.06em;fill:#e9efe9;paint-order:stroke;stroke:#0b1214;stroke-width:2px;stroke-linejoin:round;text-transform:uppercase}
#map .rpct{font-size:6.2px;font-family:var(--f-mono);fill:#ffd9b0;paint-order:stroke;stroke:#0b1214;stroke-width:2px}
#map .rpct.zero{fill:#9fb3ac}
#map .rpct.ok{fill:#b9ffd6}
#map .arc{fill:none;stroke:var(--hostile);stroke-width:1.1;stroke-dasharray:3 2;opacity:.9}
#map .arc.anim{animation:arcflow 1.4s linear infinite}
@keyframes arcflow{to{stroke-dashoffset:-10}}
#map .route{fill:none;stroke:var(--amber);stroke-width:.9;stroke-dasharray:2 2;opacity:.8}
.brig .pulse{animation:pulse 2.2s ease-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes pulse{0%{opacity:.7;transform:scale(.6)}100%{opacity:0;transform:scale(2.2)}}

.ov{position:absolute;background:rgba(14,22,26,.92);border:1px solid var(--line2);border-radius:var(--r);backdrop-filter:blur(3px)}
.ov-dir{top:10px;left:10px;max-width:340px;padding:10px 12px}
.ov-dir .t{font-weight:600;line-height:1.3}
.ov-dir .rw{font-size:12px;color:var(--good);margin-top:3px}
.ov-dir .dl{font-family:var(--f-mono);font-size:12px;color:var(--amber)}
.ov-legend{left:10px;bottom:10px;padding:8px 10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--dim)}
.ov-legend .sw{display:inline-block;width:14px;height:9px;border-radius:2px;vertical-align:-1px;margin-right:4px;border:1px solid rgba(0,0,0,.4)}
.ov-zoom{right:10px;top:10px;display:flex;flex-direction:column;overflow:hidden}
.ov-zoom button{background:transparent;border:0;border-bottom:1px solid var(--line2);width:32px;height:30px;font-size:16px;color:var(--ink)}
.ov-zoom button:last-child{border-bottom:0;font-size:11px}
.ov-region{right:10px;bottom:10px;width:300px;padding:12px}
.reg-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.reg-h .n{font-weight:700;font-size:16px;line-height:1.2;text-wrap:balance}
.chip{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:3px;border:1px solid currentColor;white-space:nowrap}
.st-Clear{color:var(--good)} .st-Contained{color:#a9c98f} .st-Outbreak{color:var(--warn)} .st-Epidemic{color:var(--t-fires)} .st-Collapsing{color:var(--hostile)} .st-Restored{color:var(--t-cure);background:#123222} .st-Fallen{color:#ff6a5e;background:#3d0e10}
.popbar{display:flex;height:9px;border-radius:2px;overflow:hidden;margin:8px 0 4px;background:var(--panel2)}
.popbar i{display:block;height:100%}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:12.5px}
.kv dt{color:var(--dim)} .kv dd{margin:0;text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.reg-act{margin-top:10px;display:flex;gap:8px;align-items:center}
.btn{background:var(--amber);color:var(--amber-ink);border:0;border-radius:var(--r);padding:9px 14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:13px}
.btn:hover{filter:brightness(1.1)}
.btn[disabled]{background:var(--raise);color:var(--faint);cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line2)}
.btn.ghost:hover{border-color:var(--dim)}
.note{font-size:12px;color:var(--dim)}
.check{list-style:none;margin:10px 0 0;padding:8px 10px;border-radius:5px;background:#0f1f19;border:1px solid #1f4434;display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--dim)}
.check li{display:flex;gap:8px}
.check li span{width:12px;flex:none;color:var(--faint)}
.check li.ok{color:var(--ink)} .check li.ok span{color:var(--t-cure)}
.check li.hd{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--t-cure)}
.here{color:var(--friend);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase}

/* side */
.side{display:flex;flex-direction:column;min-height:0;background:var(--panel)}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:transparent;border:0;border-bottom:2px solid transparent;padding:9px 4px;font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.tabs button[aria-selected="true"]{color:var(--amber);border-bottom-color:var(--amber)}
.tabbody{flex:1;overflow-y:auto;padding:12px 14px 16px;min-height:0}
.sec{margin-bottom:14px}
.sec>.lbl{display:block;margin-bottom:6px}
.cmdline{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cmdline .nm{font-weight:700;font-size:15px}
.pers{font-family:var(--f-mono);font-size:22px;font-weight:700;color:var(--friend)}
.posture{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:4px}
.posture button{background:var(--panel2);border:1px solid var(--line2);border-radius:var(--r);padding:7px 4px;font-weight:700;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.posture button[aria-pressed="true"]{background:#2a2111;border-color:var(--amber);color:var(--amber)}
.meters{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.meter .top{display:flex;justify-content:space-between;font-size:12px}
.meter .top .mono{font-size:12px}
.meter .bar{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;margin-top:3px}
.meter .bar i{display:block;height:100%;background:var(--dim);transition:width .5s}
.units{display:flex;flex-direction:column;gap:5px}
.unit{display:grid;grid-template-columns:1fr 72px 38px;gap:8px;align-items:center;font-size:12.5px}
.unit .sub{display:block;font-size:10.5px;color:var(--faint);line-height:1.15}
.unit .bar{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden}
.unit .bar i{display:block;height:100%;background:var(--friend)}
.unit .mono{text-align:right;font-size:12px}
.unit.bn{align-items:start}
.unit.bn>span:first-child{display:flex;flex-direction:column;gap:1px}
.unit .faint{color:var(--faint)}
.trait-t{color:#c9d6d0}
.rank{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--dim)}
.rank.r1{color:#c9b37a}.rank.r2{color:#e8c547}.rank.r3{color:#ffd36b;text-shadow:0 0 6px rgba(255,200,80,.35)}
.xp{display:block;height:3px;background:var(--panel2);border-radius:2px;overflow:hidden;margin-top:2px;max-width:150px}
.xp i{display:block;height:100%;background:#c9b37a}
.tfb{align-self:flex-start;font-size:9.5px;letter-spacing:.1em;font-weight:700;color:#8fd3ea;border:1px solid #2d5866;border-radius:3px;padding:0 4px;margin-left:4px;white-space:nowrap}
.doc{display:flex;flex-direction:column;font-size:12.5px;padding:5px 0;border-bottom:1px solid var(--line)}
.doc b{color:var(--t-command);font-weight:700}
.doc span{color:var(--dim)}
.btn.sm{padding:6px 10px;font-size:11.5px}
.tfline{margin-top:8px}
.helos{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;margin-top:6px}
.helos span{font-family:var(--f-mono)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.en{font-size:11px;padding:2px 6px;border-radius:3px;background:#17302a;color:var(--good);border:1px solid #275045}
.en.off{background:#301616;color:#ff8a7e;border-color:#5a2424;text-decoration:line-through}
.rlist{display:flex;flex-direction:column;gap:2px}
.rrow{display:grid;grid-template-columns:10px 1fr auto auto;gap:8px;align-items:center;padding:5px 6px;border-radius:4px;background:transparent;border:0;text-align:left;font-size:13px;width:100%}
.rrow:hover,.rrow.sel{background:var(--panel2)}
.rrow .dot{width:10px;height:10px;border-radius:2px}
.rrow .mono{font-size:12px;color:var(--dim)}
.log{display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.log div{padding-left:10px;border-left:2px solid var(--line2);color:var(--dim)}
.log div.good{border-color:var(--good);color:var(--ink)} .log div.bad{border-color:var(--hostile);color:var(--ink)}
.trait{display:inline-block;margin:0 4px 4px 0;font-size:11.5px;padding:2px 7px;border-radius:3px;background:#3a1616;color:#ffb3a8;border:1px solid #5a2424}
.rating{display:grid;grid-template-columns:1fr auto;gap:3px 10px;font-size:12.5px}
.rating .mono{color:var(--hostile)}
.trend{width:100%;height:auto;display:block}
.trend text{font-family:var(--f-mono);font-size:9px;fill:var(--dim)}

/* hand */
.handbar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:max(10px,env(safe-area-inset-bottom,0px));background:var(--panel);border-top:1px solid var(--line)}
.cpbox{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.pips{display:flex;gap:4px}
.pip{width:15px;height:15px;border-radius:50%;border:2px solid var(--amber)}
.pip.on{background:var(--amber);box-shadow:0 0 8px rgba(240,165,58,.5)}
.deckinfo{font-size:11.5px;color:var(--dim)}
.deckinfo button{background:none;border:0;color:var(--friend);padding:0;text-decoration:underline;font-size:11.5px}
.hand{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 4px;scroll-snap-type:x proximity;min-height:250px;align-items:flex-end}
.hand:empty::before{content:"No orders in hand. End the week to draw 5 new cards.";color:var(--faint);font-size:13px;align-self:center}
.card{flex:0 0 164px;height:240px;scroll-snap-align:start;display:flex;flex-direction:column;text-align:left;background:linear-gradient(180deg,var(--raise),var(--panel2));border:1px solid var(--line2);border-radius:8px;padding:0;overflow:hidden;position:relative;transition:transform .15s, box-shadow .15s, opacity .2s;--tc:var(--dim)}
.card:hover:not(.no){transform:translateY(-6px);box-shadow:0 10px 24px rgba(0,0,0,.5);border-color:var(--tc)}
.card.no{opacity:.45;cursor:not-allowed}
.card .band{display:flex;align-items:center;gap:6px;padding:6px 8px;background:color-mix(in srgb, var(--tc) 22%, transparent);border-bottom:1px solid color-mix(in srgb, var(--tc) 45%, transparent)}
.card .band svg{width:14px;height:14px;flex:none;color:var(--tc)}
.card .ty{font-size:10px;font-weight:700;letter-spacing:.14em;color:var(--tc);flex:1}
.card .cost{width:22px;height:22px;border-radius:50%;background:var(--amber);color:var(--amber-ink);font-family:var(--f-mono);font-weight:800;font-size:13px;display:grid;place-items:center;flex:none}
.card .cost.z{background:transparent;color:var(--amber);border:1.5px solid var(--amber)}
.card .art-wrap{position:relative;flex:none;aspect-ratio:160/80;overflow:hidden;border-bottom:1px solid color-mix(in srgb, var(--tc) 50%, transparent);background:#05080a}
.card .art{position:absolute;inset:0;width:100%;height:100%;display:block;transition:transform .4s ease}
.card:hover:not(.no) .art{transform:scale(1.06)}
.card .art-wrap .ty{position:absolute;left:5px;top:5px;display:flex;align-items:center;gap:4px;padding:2px 6px 2px 4px;border-radius:3px;background:rgba(5,8,10,.78);border:1px solid color-mix(in srgb, var(--tc) 45%, transparent);font-size:9px;font-weight:700;letter-spacing:.13em;color:var(--tc);line-height:1.3}
.card .art-wrap .ty svg{width:11px;height:11px;flex:none;color:var(--tc)}
.card .art-wrap .cost{position:absolute;right:5px;top:5px;box-shadow:0 0 0 2px rgba(5,8,10,.7)}
.card .art-wrap .cost.z{background:rgba(5,8,10,.78)}
.card .nm{font-weight:700;font-size:14.5px;line-height:1.15;padding:6px 9px 0;text-wrap:balance}
.card .un{font-size:10px;color:var(--faint);padding:2px 9px 0;letter-spacing:.02em;line-height:1.2}
.card .tx{font-size:11.8px;line-height:1.3;padding:4px 9px 5px;color:#c4cfca;flex:1;overflow:hidden}
.card .tx b{color:#fff}
.card .rs{display:flex;gap:4px;padding:0 8px 8px;flex-wrap:wrap}
.card .rs span{font-family:var(--f-mono);font-size:10.5px;padding:1px 5px;border-radius:3px;background:rgba(0,0,0,.35);color:var(--dim)}
.card .rs span.short{color:var(--hostile)}
.card .ex{position:absolute;right:38px;bottom:10px;font-size:9.5px;color:var(--warn);letter-spacing:.1em}
.card .why{position:absolute;inset:auto 0 0 0;background:rgba(40,12,12,.95);color:#ffb3a8;font-size:11px;padding:4px 8px;display:none}
.card.no:hover .why,.card.no:focus .why{display:block}
.card.fly{animation:fly .35s ease-in forwards}
.card.up{border-color:color-mix(in srgb, var(--amber) 55%, var(--line2))}
.card .cost sup{font-size:9px;margin-left:1px;vertical-align:super}
.deckgrid .card.upc:hover{border-color:var(--amber)}
.slot{flex:0 0 164px;position:relative;scroll-snap-align:start;display:flex}
.slot .card{flex:1 1 auto;width:100%}
.burn{position:absolute;right:6px;bottom:6px;z-index:2;height:26px;min-width:26px;padding:0 5px;border-radius:13px;border:1px solid #6a2a1a;background:rgba(22,9,6,.9);color:#ff8a4c;display:flex;align-items:center;justify-content:center;gap:5px;font-size:11.5px;font-weight:700;letter-spacing:.04em;white-space:nowrap;transition:transform .15s, background .15s, color .15s}
.burn svg{width:14px;height:14px;flex:none}
.burn .bl{display:none}
.burn:hover:not([disabled]){border-color:#ff7a4a;color:#ffb07a}
.burn.arm{background:#b3361d;border-color:#ff8a5a;color:#fff;padding:0 9px 0 7px;box-shadow:0 0 14px rgba(255,90,40,.55)}
.burn.arm .bl{display:inline}
.burn[disabled]{opacity:.3;cursor:not-allowed}
.slot:hover .card:not(.no) ~ .burn{transform:translateY(-6px)}
.card.burnt{animation:burnt .32s ease-in forwards}
@keyframes burnt{0%{filter:none}40%{filter:sepia(1) saturate(4) hue-rotate(-25deg) brightness(1.2)}100%{filter:sepia(1) saturate(4) hue-rotate(-25deg) brightness(.3);opacity:0;transform:scale(.9) translateY(8px)}}
.pip.half{border-color:var(--amber);background:linear-gradient(90deg,var(--amber) 50%,transparent 50%)}
@keyframes fly{to{transform:translateY(-120px) scale(.9);opacity:0}}
.card.big{flex-basis:210px;height:300px}
.card.big .nm{font-size:17px}.card.big .tx{font-size:13px}
.t-COMBAT{--tc:var(--t-combat)} .t-FIRES{--tc:var(--t-fires)} .t-AIR{--tc:var(--t-air)} .t-INTEL{--tc:var(--t-intel)} .t-RESEARCH{--tc:var(--t-research)} .t-MEDICAL{--tc:var(--t-medical)} .t-LOGISTICS{--tc:var(--t-logistics)} .t-CIVIL{--tc:var(--t-civil)} .t-COMMAND{--tc:var(--t-command)} .t-CURE{--tc:var(--t-cure)}
.endbox{display:flex;flex-direction:column;align-items:stretch;gap:6px;min-width:150px}
.endbtn{font-size:16px;padding:14px 18px;font-family:var(--f-display);letter-spacing:.08em;font-weight:400}
.endhint{font-size:11.5px;color:var(--dim);text-align:center}

/* toast */
#toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:30;pointer-events:none;width:min(560px,calc(100% - 32px))}

// ---------------------------------------------------------------- rng
function hashSeed(str) { let h = 2166136261 >>> 0; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h | 0; }
function rnd(s) { s.rng = (s.rng + 0x6D2B79F5) | 0; let t = s.rng; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
function rint(s, a, b) { return a + Math.floor(rnd(s) * (b - a + 1)); }
function pick(s, arr) { return arr[Math.floor(rnd(s) * arr.length)]; }
function shuffle(s, arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rnd(s) * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ---------------------------------------------------------------- helpers
function hops(from, to, maxH = 6) {
  if (from === to) return 0;
  const seen = { [from]: 0 }; let q = [from];
  while (q.length) { const nq = []; for (const c of q) for (const e of ADJ[c]) if (seen[e.to] === undefined) { seen[e.to] = seen[c] + 1; if (e.to === to) return seen[e.to]; nq.push(e.to); } q = nq; if (seen[q[0]] > maxH) break; }
  return 99;
}
function neighbors(id) { return [...new Set(ADJ[id].map(e => e.to))]; }
const T = s => s.regions[s.b.loc];          // theater region state
const TD = s => RD[s.b.loc];                // theater static data
const hasD = (s, id) => !!(s.doct && s.doct.includes(id));
const tfBn = s => s.b.tf ? s.b.tf.bn : null;
const mainBns = s => BNS.filter(k => k !== tfBn(s));
// combat strength of the main body (a detached Task Force battalion doesn't count)
const man = s => mainBns(s).reduce((a, k) => a + s.b.u[k], 0) / 3;
const allMan = s => (s.b.u.bn1 + s.b.u.bn2 + s.b.u.bn3) / 3;
const rankIdx = xp => RANKS.reduce((a, r, i) => xp >= r.xp ? i : a, 0);
const vetOf = (s, k) => (s.b.vet && s.b.vet[k]) || { xp:0, cdr:{ name:'', trait:'tactician' } };
const traitOf = (s, k) => TRAITS[vetOf(s, k).cdr.trait] || {};
function vetKillOne(s, k) { return RANKS[rankIdx(vetOf(s, k).xp)].kill * (traitOf(s, k).kill || 1); }
function vetKill(s, keys) { keys = keys || mainBns(s); if (!keys.length) return 1; return keys.reduce((a, k) => a + vetKillOne(s, k), 0) / keys.length; }
function vetCas(s, k) { if (!BNS.includes(k)) return 1; return RANKS[rankIdx(vetOf(s, k).xp)].cas * (traitOf(s, k).cas || 1); }
function newCdr(s) { return { name:`Lt. Col. ${pick(s, CDR_FIRST)} ${pick(s, CDR_LAST)}`, trait:pick(s, Object.keys(TRAITS)) }; }
function gainXP(s, keys, amt, rep) {
  for (const k of keys) {
    const v = s.b.vet[k]; const before = rankIdx(v.xp); v.xp += amt * (hasD(s, 'cadre') ? 1.5 : 1); const after = rankIdx(v.xp);
    if (after > before) { const t = `${UNITS[k].name} is now ${RANKS[after].name.toUpperCase()} (${v.cdr.name}).`; if (rep) rep.items.push({ k:'good', t }); else s.log.push(t); add(s,'morale',2); }
  }
}
function monthOf(turn) { return new Date(Date.UTC(2027, 3, 12) + (turn - 1) * 7 * 864e5).getUTCMonth(); }
function seasonOf(hemi, m) { if (hemi === 'T') return 'tropical'; if (hemi === 'S') m = (m + 6) % 12; return m === 11 || m <= 1 ? 'winter' : m <= 4 ? 'spring' : m <= 7 ? 'summer' : 'autumn'; }
function seasonMult(s, rid) { const se = seasonOf(HEMI[rid], monthOf(s.turn)); const rd = RD[rid]; if (se === 'winter') return rd.clim === 'cold' ? .62 + .38 * s.path.coldTol : .86; if (se === 'summer') return 1.06; return 1; }
const chokesLost = s => Object.keys(CHOKE).filter(id => s.regions[id].fallen);
function eff(s) { const b = s.b; return (0.55 + b.morale / 220) * (b.ammo > 0 ? 1 : 0.4) * (b.supply > 0 ? 1 : 0.7); }
function scale(id) { return clamp(Math.pow(200 / RD[id].pop, 0.35), 0.45, 1.6); }
function personnel(s) { let p = 0; for (const k in NOMINAL) p += NOMINAL[k] * s.b.u[k]; return Math.round(p); }
function survivors(s) { let h = 0; for (const r of REGIONS) h += s.regions[r.id].h * r.pop; return h; }
function infected(s) { let z = 0; for (const r of REGIONS) z += s.regions[r.id].z * r.pop; return z; }
function dead(s) { let d = 0; for (const r of REGIONS) d += s.regions[r.id].d * r.pop; return d; }
function fallenCount(s) { return REGIONS.filter(r => s.regions[r.id].fallen).length; }
function worldFactor(s) { const sf = survivors(s) / START_POP; return clamp(Math.pow(sf, 1.5) * (1 - fallenCount(s) / REGIONS.length * 0.8), 0.2, 1); }
function activeLabs(s) { return s.labs.filter(l => l.active); }
function labIn(s, id) { return s.labs.find(l => l.active && l.region === id); }
const RESTORE_WEEKS = 20;
const RESTORE_REQ = { z:.005, order:50, vax:.5 };
function restoreReady(rs) { return !rs.fallen && rs.z < RESTORE_REQ.z && rs.order >= RESTORE_REQ.order && (rs.vax || 0) >= RESTORE_REQ.vax; }
function restoredCount(s) { return REGIONS.filter(r => s.regions[r.id].restored).length; }
function avgVax(s) { let v = 0, p = 0; for (const r of REGIONS) { v += (s.regions[r.id].vax || 0) * r.pop; p += r.pop; } return v / p; }
function status(rs) {
  if (rs.restored) return 'Restored';
  if (rs.fallen) return 'Fallen';
  if (rs.z <= 0) return 'Clear';
  if (rs.z < 0.002) return 'Contained';
  if (rs.z < 0.02) return 'Outbreak';
  if (rs.z < 0.1) return 'Epidemic';
  return 'Collapsing';
}
function caps(s) { const q = hasD(s, 'qm'); return { supply:q ? 130 : 100, ammo:q ? 130 : 100, fuel:q ? 130 : 100, med:q ? 65 : 50, morale:100, exposure:100, trust:100 }; }
function add(s, k, v) {
  const b = s.b; const cp = caps(s);
  if (k === 'trust' && v > 0 && s.cmd === 'hard') v = Math.ceil(v * .75);
  if (k === 'trust' && v < 0 && hasD(s, 'infoops')) v = v * .75;
  if (k === 'exposure' && v > 0 && hasD(s, 'cbrn')) v = v * .75;
  b[k] = clamp((b[k] || 0) + v, 0, cp[k] ?? 999);
}
function weakestBns(s, n) { return mainBns(s).sort((a, c) => s.b.u[a] - s.b.u[c]).slice(0, n); }
function heal(s, keys, amt) { for (const k of keys) s.b.u[k] = clamp(s.b.u[k] + amt, 0, 1); }
function cas(s, frac, keys) {
  const b = s.b; keys = keys || [pick(s, mainBns(s))];
  keys = keys.filter(k => k !== tfBn(s) || keys.length === 1);
  let mult = (b.en.med ? 0.8 : 1) * (1 - b.fort) * (hasD(s, 'night') ? .85 : 1);
  let tot = 0; for (const k of keys) { const loss = Math.min(b.u[k], frac * mult * vetCas(s, k)); b.u[k] -= loss; tot += loss * NOMINAL[k]; }
  s.stats.kia += Math.round(tot); return Math.round(tot);
}
function cmdKill(s, type) {
  let m = (s.cmd === 'mech' && (type === 'COMBAT' || type === 'FIRES')) ? 1.15 : 1;
  if (type === 'FIRES' && hasD(s, 'fires')) m *= 1.25;
  if (type === 'COMBAT' && hasD(s, 'shock')) m *= 1.15;
  if (type === 'AIR' && hasD(s, 'rotary')) m *= 1.25;
  if (type === 'COMBAT' || type === 'FIRES') m *= vetKill(s);
  return m;
}
// fraction of infected removed by an action in the theater
function kp(s, base, str, type, boost = true) {
  let f = base * str * eff(s) * scale(s.b.loc) * cmdKill(s, type) * (boost ? 1 + s.b.boost : 1);
  return clamp(f, 0, 0.6);
}
function doKill(s, f, rid) {
  const rs = s.regions[rid || s.b.loc]; const P = RD[rid || s.b.loc].pop;
  const k = rs.z * f; rs.z -= k; rs.d += k; s.stats.kills += k * P; return k * P;
}
function save(s, frac, rid) {
  rid = rid || s.b.loc; const rs = s.regions[rid];
  if (s.cmd === 'civ') frac *= 1.3;
  if (hasD(s, 'hearts')) frac *= 1.25;
  frac *= scale(rid);
  const exposed = Math.max(0, rs.h - rs.safe); const amt = exposed * clamp(frac, 0, 0.5);
  rs.safe += amt; const m = amt * RD[rid].pop; s.stats.saved += m; return m;
}
// civilian casualties in millions of people, capped at half the unprotected population
function civLoss(s, people) { const rs = T(s); const P = TD(s).pop; const l = Math.min(Math.max(0, rs.h - rs.safe) * .5, people / P); rs.h -= l; rs.d += l; s.stats.civLost = (s.stats.civLost || 0) + l * P; return l * P; }
// estimated number of infected removed by a kill fraction, as text
const est = (s, f) => M(T(s).z * TD(s).pop * f);
const ART_COLLATERAL = .1, THERMO_COLLATERAL = .5;
function contain(s, v, rid) { const rs = s.regions[rid || s.b.loc]; rs.contain = clamp(rs.contain + v, 0, 0.85); }
const M = v => v >= 1000 ? (v / 1000).toFixed(2) + 'B' : v >= 1 ? v.toFixed(1) + 'M' : v >= .001 ? Math.round(v * 1000) + 'K' : v > 0 ? Math.max(1, Math.round(v * 1e6)).toLocaleString('en-US') : '0';
const pc = f => Math.round(f * 100) + '%';
function supplyFlow(s) {
  const b = s.b; const rs = T(s); const rd = TD(s);

}

// ---------------------------------------------------------------- deck
function draw(s, n) {
  const d = s.deck;
  for (let i = 0; i < n; i++) {
    if (!d.draw.length) { if (!d.discard.length) return; d.draw = shuffle(s, d.discard); d.discard = []; }
    if (d.hand.length >= 10) return;
    d.hand.push(d.draw.pop());
  }
}
const baseId = id => (id && id.endsWith('+')) ? id.slice(0, -1) : id;
const isUp = id => !!id && id.endsWith('+');
const def = id => CARDS[baseId(id)];
const costOf = id => Math.max(0, (def(id) ? def(id).cost : 0) - (isUp(id) ? 1 : 0));
const canUpgrade = id => !isUp(id) && !!def(id) && def(id).cost >= 1;
const cardName = id => def(id).name + (isUp(id) ? '+' : '');
function canPlay(s, idx) {
  const id = s.deck.hand[idx]; const c = def(id); if (!c) return 'Unknown card';
  if (s.over) return 'Game over';
  if (s.crisis) return 'Resolve the crisis first';
  if (s.cureChoice) return 'Decide what to do with the cure first';
  if (costOf(id) > s.cp) return 'Not enough Command Points';
  for (const k in c.res) if (s.b[k] < c.res[k]) return 'Not enough ' + k;
  if (c.type === 'AIR' && s.b.fuel <= 0) return 'Aircraft grounded: no fuel';
  const r = c.req(s); if (r !== true) return r;
  return true;
}
function playCard(s, idx) {
  const ok = canPlay(s, idx); if (ok !== true) return { ok:false, msg:ok };
  const id = s.deck.hand.splice(idx, 1)[0]; const c = def(id);
  s.cp -= costOf(id); for (const k in c.res) s.b[k] -= c.res[k];
  const msg = c.play(s);
  if ((c.type === 'COMBAT' || c.type === 'FIRES') && T(s).z > .0005) gainXP(s, mainBns(s), .5);
  if (c.exhaust) s.deck.exhausted.push(id); else s.deck.discard.push(id);
  s.stats.cards++; s.log.push(msg);
  if (c.type === 'RESEARCH') s.flags.researchCards++;

  checkOver(s);
  return { ok:true, msg };
}

// ---------------------------------------------------------------- movement
function deployCost(s, to) {

  let cp = h === 1 ? 1 : 2, fuel = 4 + 4 * h;
  if (hasD(s, 'airmobile')) { cp = Math.max(0, cp - 1); fuel = Math.max(0, fuel - 4); }
  if (s.b.freeMove) { cp = 0; fuel = Math.ceil(fuel / 2); }
  return { hops:h, cp, fuel };
}
function canDeploy(s, to) {
  if (s.over) return 'Game over'; if (s.crisis) return 'Resolve the crisis first'; if (s.cureChoice) return 'Decide what to do with the cure first';
  if (to === s.b.loc) return 'Already deployed here';
  if (s.b.moved) return 'The brigade already redeployed this week';
  const c = deployCost(s, to); if (c.hops > 5) return 'Too far';
  if (s.cp < c.cp) return 'Not enough Command Points'; if (s.b.fuel < c.fuel) return 'Not enough fuel';
  return true;
}
function deploy(s, to) {
  const ok = canDeploy(s, to); if (ok !== true) return { ok:false, msg:ok };
  const c = deployCost(s, to); s.cp -= c.cp; s.b.fuel -= c.fuel; s.b.loc = to; s.b.moved = true; s.b.freeMove = false; s.b.fort = 0; s.b.fortT = 0;
  if (s.b.tf && s.b.tf.loc === to) { s.log.push(`${UNITS[s.b.tf.bn].name} rejoined the main body.`); s.b.tf = null; }
  const msg = `The brigade redeployed to ${RD[to].name}.`; s.log.push(msg); return { ok:true, msg };
}
// ---- Task Force: detach one battalion to operate in a second region
function tfCandidate(s) { return s.b.tf ? s.b.tf.bn : BNS.slice().sort((a, c) => s.b.u[c] - s.b.u[a])[0]; }
function tfCost(s, to) { const from = s.b.tf ? s.b.tf.loc : s.b.loc; const h = hops(from, to); let cp = 1, fuel = 4 + 3 * h; if (hasD(s, 'airmobile')) { cp = 0; fuel = Math.max(0, fuel - 4); } return { hops:h, cp, fuel }; }
function canSendTF(s, to) {
  if (s.over) return 'Game over'; if (s.crisis) return 'Resolve the crisis first'; if (s.cureChoice) return 'Decide what to do with the cure first';
  if (to === s.b.loc) return 'The main body is already here';
  if (s.b.tf && s.b.tf.loc === to) return 'The Task Force is already here';
  if (s.b.tfMoved) return 'The Task Force already moved this week';
  const c = tfCost(s, to); if (c.hops > TF_RANGE) return 'Too far for a Task Force';
  const bn = tfCandidate(s); if (s.b.u[bn] < .25) return 'No battalion is strong enough to detach';
  if (!s.b.tf && mainBns(s).length < 3) return 'A Task Force is already detached';
  if (s.cp < c.cp) return 'Not enough Command Points'; if (s.b.fuel < c.fuel) return 'Not enough fuel';
  return true;
}
function sendTF(s, to) {
  const ok = canSendTF(s, to); if (ok !== true) return { ok:false, msg:ok };
  const c = tfCost(s, to); const bn = tfCandidate(s); s.cp -= c.cp; s.b.fuel -= c.fuel;
  const moved = !!s.b.tf; s.b.tf = { bn, loc:to, since:s.turn }; s.b.tfMoved = true;
  const msg = moved ? `Task Force ${UNITS[bn].name} moved to ${RD[to].name}.` : `${UNITS[bn].name} detached as a Task Force to ${RD[to].name}.`;
  s.log.push(msg); return { ok:true, msg };
}
function recallCost(s) { const h = s.b.tf ? hops(s.b.tf.loc, s.b.loc) : 0; return { hops:h, cp:hasD(s, 'airmobile') ? 0 : 1, fuel:Math.max(0, 3 * h - (hasD(s, 'airmobile') ? 4 : 0)) }; }
function canRecallTF(s) {
  if (!s.b.tf) return 'No Task Force detached'; if (s.over) return 'Game over'; if (s.crisis) return 'Resolve the crisis first'; if (s.cureChoice) return 'Decide what to do with the cure first';
  const c = recallCost(s); if (s.cp < c.cp) return 'Not enough Command Points'; if (s.b.fuel < c.fuel) return 'Not enough fuel'; return true;
}
function recallTF(s) {
  const ok = canRecallTF(s); if (ok !== true) return { ok:false, msg:ok };

  const msg = `${UNITS[bn].name} rejoined the main body.`; s.log.push(msg); return { ok:true, msg };
}
const POSTURES = {

  const m = openModal(`<div class="dlg-h"><div><div class="k" style="color:var(--amber)">Situation report · ${dateOf(rep.turn)}</div><h2>Week ${rep.turn} SITREP</h2></div></div>
    <div class="dlg-b"><div class="sit-top">
      <div class="stat"><span class="lbl">Survivors</span><span class="v mono ${dh < -1 ? 'bad' : ''}">${dh < 0 ? '−' : '+'}${fmtPop(Math.abs(dh))}</span></div>
      <div class="stat"><span class="lbl">Infected</span><span class="v mono ${dz > 0 ? 'bad' : 'good'}">${dz >= 0 ? '+' : '−'}${fmtPop(Math.abs(dz))}</span></div>
      ${rep.phase === 'restore' ? `<div class="stat"><span class="lbl">Regions restored</span><span class="v mono good">${rep.restoredAfter}/${E.REGIONS.length}${rep.restoredAfter > rep.restoredBefore ? ` <small>+${rep.restoredAfter - rep.restoredBefore}</small>` : ''}</span></div>` : `<div class="stat"><span class="lbl">Cure research</span><span class="v mono good">+${dr.toFixed(1)}%</span></div>`}
      <div class="stat"><span class="lbl">Brigade</span><span class="v mono ${dp < 0 ? 'bad' : ''}">${dp <= 0 ? '−' : '+'}${Math.abs(dp)}</span></div></div>
      <div class="sit-items">${items.map(i => `<div class="${i.k}">${esc(i.t)}</div>`).join('') || '<div>A quiet week.</div>'}</div></div>
    <div class="dlg-f"><button class="btn" id="b-cont">Continue</button></div>`, '', k => { if (k === 'Enter' || k === ' ') flow(); });
  $('#b-cont', m).onclick = flow;
}
function showReward() {
  const pr = S.pendingReward;
  const m = openModal(`<div class="dlg-h"><div><div class="k" style="color:var(--good)">${esc(pr.reason)}</div><h2>Choose a new order</h2></div></div>
    <div class="dlg-b"><p class="note" style="font-size:14px">Higher command is sending reinforcements and new capabilities. Pick one card to add to your deck.</p><div class="rewards">${pr.options.map(id => cardHTML(id, { cls:'big', attr:`data-id="${id}"` })).join('')}</div></div>
    <div class="dlg-f"><button class="btn ghost" id="b-up">Upgrade a card instead</button><button class="btn ghost" id="b-rm">Remove a card instead</button><button class="btn ghost" id="b-sup">Take a supply drop (+15 supply, +10 ammo)</button></div>`, 'wide');
  for (const b of $$('.rewards .card', m)) b.onclick = () => { E.takeReward(S, b.dataset.id); toast(E.cardName(b.dataset.id) + ' added to your deck.'); flow(); };
  $('#b-sup', m).onclick = () => { E.takeReward(S, 'supply'); flow(); };
  $('#b-rm', m).onclick = () => showDeck(true);
  $('#b-up', m).onclick = () => showDeck('upgrade');
}
function showDeck(mode) {
  const upMode = mode === 'upgrade', rmMode = mode === true;
  let list = E.deckList(S).slice().sort((a, b) => E.def(a).type.localeCompare(E.def(b).type) || a.localeCompare(b));
  if (upMode) list = [...new Set(list.filter(E.canUpgrade))];
  const m = openModal(`<div class="dlg-h"><div><div class="k" style="color:var(--amber)">${rmMode ? 'Trim the deck' : upMode ? 'Upgrade' : 'Your deck'}</div><h2>${rmMode ? 'Remove one card' : upMode ? 'Upgrade one card' : list.length + ' orders'}</h2></div><button class="hbtn" id="b-x">${mode ? 'Back' : 'Close'}</button></div>
    <div class="dlg-b">${upMode ? '<p class="note" style="font-size:14px">An upgraded card costs 1 Command Point less, permanently. Pick one.</p>' : ''}<div class="deckgrid">${list.map(id => cardHTML(upMode ? id + '+' : id, { cls: rmMode ? 'rm' : upMode ? 'upc' : '', attr:`data-id="${id}"` })).join('') || '<p class="note">No cards can be upgraded right now.</p>'}</div>
    ${S.deck.exhausted.length ? `<p class="note" style="margin-top:12px">Used up: ${S.deck.exhausted.map(id => esc(E.cardName(id))).join(', ')}</p>` : ''}
    ${(S.deck.burned || []).length ? `<p class="note" style="margin-top:6px">Burned: ${S.deck.burned.map(id => esc(E.cardName(id))).join(', ')}</p>` : ''}</div>`, 'wide');
  $('#b-x', m).onclick = () => mode ? showReward() : closeModal();
  if (rmMode) for (const b of $$('.deckgrid .card', m)) b.onclick = () => { E.takeReward(S, 'remove:' + b.dataset.id); flow(); };
  else if (upMode) for (const b of $$('.deckgrid .card', m)) b.onclick = () => { E.takeReward(S, 'upgrade:' + b.dataset.id); toast(`${E.cardName(b.dataset.id)}+ now costs ${E.costOf(b.dataset.id + '+')}.`); flow(); };
  else for (const b of $$('.deckgrid .card', m)) b.onclick = () => {};
}
function showBoard() {
  const pd = S.pendingDoctrine;
  const m = openModal(`<div class="crisis-art">${ART.svg('rally', 'COMMAND', '', true)}</div><div class="dlg-h"><div><div class="k" style="color:var(--t-command)">Promotion Board · Week ${pd.week}</div><h2>Choose a doctrine</h2></div></div>
    <div class="dlg-b"><p>Your staff has earned a say in how this war is fought. Pick one doctrine. It lasts for the rest of the campaign.</p>
    <div class="opts">${pd.options.map((id, i) => `<button class="opt" data-d="${id}"><span class="num">${i + 1}</span><span><span class="ol">${esc(E.DOCTRINES[id].name)}</span><div class="of">${esc(E.DOCTRINES[id].text)}</div></span></button>`).join('')}</div>
    ${(S.doct || []).length ? `<p class="note" style="margin-top:12px">Already adopted: ${S.doct.map(id => esc(E.DOCTRINES[id].name)).join(', ')}</p>` : ''}</div>`, '', k => { const id = pd.options[+k - 1]; if (id) pickD(id); });
  const pickD = id => { const r = E.takeDoctrine(S, id); if (r.ok) toast(r.msg); flow(); };
  for (const b of $$('.opt', m)) b.onclick = () => pickD(b.dataset.d);
}
function showGameOver() {
  const o = S.over; const mt = meta();
  if (!S.recorded) { S.recorded = true; S.unlockedNow = mt.maxWeeks < 20 && S.turn >= 20; mt.runs++; if (o.win) mt.wins++; mt.best = Math.max(mt.best, o.score); mt.maxWeeks = Math.max(mt.maxWeeks, S.turn); put(META_KEY, mt); drop(SAVE_KEY); }
  const sv = E.survivors(S);
  const unlockedNow = !!S.unlockedNow;
  const art = o.win ? ART.svg(S.phase === 'restore' ? 'restore_gov' : 'cure', S.phase === 'restore' ? 'CIVIL' : 'CURE', '', true) : ART.svg(o.title === 'Mutiny' ? 'mutiny' : o.title === 'Relieved of Command' ? 'inquiry' : 'horde', o.title === 'Mutiny' || o.title === 'Relieved of Command' ? 'COMMAND' : 'COMBAT', '', true);
  const m = openModal(`<div class="crisis-art">${art}</div><div class="dlg-h"><div><div class="k" style="color:${o.win ? 'var(--good)' : 'var(--hostile)'}">${o.win ? 'Victory' : 'Defeat'} · Week ${S.turn}</div><h2>${esc(o.title)}</h2></div></div>
    <div class="dlg-b"><p>${esc(o.text)}</p>
      <div class="sit-top">
        <div class="stat"><span class="lbl">Score</span><span class="v mono" style="color:var(--amber)">${o.score.toLocaleString()}</span></div>
        <div class="stat"><span class="lbl">Survivors</span><span class="v mono">${fmtPop(sv)}</span></div>
        ${S.phase === 'restore' ? `<div class="stat"><span class="lbl">Regions restored</span><span class="v mono" style="color:var(--t-cure)">${E.restoredCount(S)}/${E.REGIONS.length}</span></div>` : `<div class="stat"><span class="lbl">Cure research</span><span class="v mono">${Math.min(100, S.research).toFixed(0)}%</span></div>`}
        <div class="stat"><span class="lbl">Weeks</span><span class="v mono">${S.turn}</span></div>
        <div class="stat"><span class="lbl">Infected destroyed</span><span class="v mono">${fmtPop(S.stats.kills)}</span></div>
        <div class="stat"><span class="lbl">${S.phase === 'restore' ? 'Infected cured' : 'Civilians saved'}</span><span class="v mono">${fmtPop(S.phase === 'restore' ? (S.stats.cured || 0) : S.stats.saved)}</span></div>
        <div class="stat"><span class="lbl">Brigade losses</span><span class="v mono">${S.stats.kia.toLocaleString()}</span></div>
        <div class="stat"><span class="lbl">Best score</span><span class="v mono">${mt.best.toLocaleString()}</span></div>
      </div>
      <p class="note">${esc(E.CMD[S.cmd].name)} · ${E.DIFFS[S.diff].name} · seed <span class="mono">${esc(S.seed)}</span> · regions fallen ${E.fallenCount(S)} · directives ${S.stats.directivesWon} won, ${S.stats.directivesLost} failed</p>
      ${unlockedNow ? '<p style="color:var(--amber)">Lt. Gen. Frank Garrison (Hardliner) is now available as a commander.</p>' : ''}</div>
    <div class="dlg-f"><button class="btn ghost" id="b-look">Look at the map</button><button class="btn ghost" id="b-same">Retry same seed</button><button class="btn" id="b-new">New run</button></div>`);
  $('#b-look', m).onclick = closeModal;
  $('#b-same', m).onclick = () => startGame({ cmd:S.cmd, diff:S.diff, seed:S.seed });
  $('#b-new', m).onclick = showTitle;
}
function showMenu() {
  const m = openModal(`<div class="dlg-h"><div><div class="k" style="color:var(--amber)">Seed ${esc(S.seed)} · progress saves every action</div><h2>Menu</h2></div><button class="hbtn" id="b-x">Close</button></div>
    <div class="dlg-b"><div class="opts">
      <button class="opt" id="m-how"><span class="num">?</span><span><span class="ol">How to play</span><div class="of">Rules, cards and win conditions.</div></span></button>
      <button class="opt" id="m-film"><span class="num">▶</span><span><span class="ol">Replay the opening cinematic</span><div class="of">Watch this run's intro again.</div></span></button>
      <button class="opt" id="m-oob"><span class="num">≡</span><span><span class="ol">Brigade order of battle</span><div class="of">What the ECB is made of.</div></span></button>
      <button class="opt" id="m-title"><span class="num">⌂</span><span><span class="ol">Title screen</span><div class="of">Your run stays saved. Continue it from the title screen.</div></span></button>
      <button class="opt" id="m-quit"><span class="num">×</span><span><span class="ol">Abandon this run</span><div class="of">Ends the run now and counts it as a loss.</div></span></button>
    </div></div>`);
  $('#b-x', m).onclick = closeModal; $('#m-how', m).onclick = showHowTo; $('#m-film', m).onclick = () => { closeModal(); CINE.play(S, enterGame); }; $('#m-oob', m).onclick = showOOB; $('#m-title', m).onclick = showTitle;
  $('#m-quit', m).onclick = () => { $('#m-quit', m).querySelector('.ol').textContent = 'Tap again to confirm'; $('#m-quit', m).onclick = () => { S.over = { win:false, title:'Run Abandoned', text:'You handed over command.' }; S.over.score = E.score(S); flow(); }; };
}
function howHTML() {
  return `<div class="howto"><ol>
    <li><b>Goal:</b> keep the world alive until the research labs finish a cure (the green bar at the top reaches 100%).</li>
    <li><b>Each week</b> you draw 5 order cards and get Command Points (the amber dots). Click a card to play it. Most cards act on the region where your brigade is deployed.</li>
    <li><b>Crises</b> pop up most weeks. Pick one of the choices. Each choice shows what it costs.</li>
    <li><b>The map</b> shows every region's infection. Click a region to inspect it, then press <b>Deploy here</b> to move the brigade (costs Command Points and fuel).</li>
    <li><b>Two free jobs every week</b> (buttons under the Command Points): <b>Air tasking</b> flies one aviation mission (scout with drones, a gun run, MEDEVAC, heavy lift, or stand down to rest the crews), and <b>Engineers</b> put a week of work into a Barrier Line, Fire Base, Field Hospital or Supply Depot where the brigade is. Neither costs Command Points.</li>
    <li><b>Posture</b> sets what the brigade does on its own every week: Assault kills more, Hold contains the spread, Relief saves civilians.</li>
    <li><b>Press End Week.</b> The outbreak spreads, labs work, your stocks are resupplied, and you get a situation report.</li>
    <li><b>Phase II: Restoration.</b> When the cure is found you can stop and take the win, or keep going for ${E.RESTORE_WEEKS} more weeks. The cure spreads from the labs. Cure the infected, reclaim fallen regions and restore order. A region is restored when infected are under 0.5%, civil order is 50 or more, and cure coverage is 50% or more. Each restored region turns green and adds to your score.</li>
    <li><b>Protect the labs</b> (hexagon icons). Labs work faster in calm regions and with your brigade on site. Recover Tissue Samples speeds the cure.</li>
    <li><b>HQ directives</b> give you a goal with a deadline. Finish them for Trust and a new card. Every 4 weeks you also pick a new card.</li>
    <li><b>You lose if</b> survivors fall below 20%, the brigade is wiped out, Morale or Command Trust hits 0, or every lab is overrun.</li>
    <li><b>Watch Exposure.</b> Fighting in infected regions builds it. At 100 the brigade has an outbreak of its own. Decon and MEDEVAC cards bring it down.</li>
    <li><b>Battalions</b> each have a named commander with a trait (shown in the Brigade tab). They gain experience from fighting: Green, Blooded, Veteran, Elite. Higher ranks kill more and lose fewer soldiers. Commanders can be killed when their battalion takes heavy losses.</li>
    <li><b>Task Force:</b> click any region and press <b>Send Task Force</b> to detach your strongest battalion there. It fights on its own every week. Your main body is a third weaker while it is away. Recall it from the region card or the Brigade tab.</li>
    <li><b>Promotion Board:</b> every ${6} weeks you pick a permanent doctrine, such as stronger artillery, bigger resupply or extra cards each week.</li>
    <li><b>Upgrades:</b> when you get a new card, you can instead upgrade one you have. Upgraded cards cost 1 Command Point less.</li>
    <li><b>Seasons and chokepoints:</b> winter slows the infected in cold regions. Five regions hold strategic chokepoints (anchor icons): Panama, Suez, Malacca, Hormuz and the Bosporus. Each one that falls shrinks your resupply.</li>
    <li><b>Burn cards</b> you don't want with the flame button on a card in your hand (tap it twice). The card leaves your deck for good and you get back half its cost in Command Points right away. Halves are saved until they add up to a whole point, so burning two 1-cost cards gives you 1 point. Your deck can't go below ${E.MIN_DECK} cards.</li>
    <li><b>Shortcuts:</b> keys 1–9 play cards or pick crisis choices, A opens air tasking, G opens engineers, E ends the week.</li>
  </ol></div>`;
}
function showHowTo() { const m = openModal(`<div class="dlg-h"><h2>How to play</h2><button class="hbtn" id="b-x">Close</button></div><div class="dlg-b">${howHTML()}</div>`, 'wide'); $('#b-x', m).onclick = () => S && $('#app') ? closeModal() : closeModal(); }
function showOOB() {
  const m = openModal(`<div class="dlg-h"><div><div class="k" style="color:var(--friend)">Order of battle</div><h2>Expeditionary Combat Brigade</h2></div><button class="hbtn" id="b-x">Close</button></div><div class="dlg-b">
    <p>A self-sufficient mechanized brigade built like a giant Marine Expeditionary Unit. About 4,800 personnel on the Modular Combat Vehicle family.</p>
    <div class="oob">EXPEDITIONARY COMBAT BRIGADE
├── Brigade HQ (MCV-C)
├── 1st / 2nd / 3rd Maneuver Bn  (MCV-M/I, 12-person squads)
│   ├── 3 maneuver companies (2 standard + 1 specialized platoon)
│   └── 4th Support Co: 120mm Indirect Fire (MCV-M/F), Engineer,
│       Heavy Weapons, Scout (snipers, QRF squads)
├── Artillery Bn (MCV-H/155)
├── Air Defense Bn (MCV-M/A)
├── Aviation Group: 4 attack, 5 multirole, 2 heavy helicopters
│   └── UAS Squadron (Tier 1 / 2 / 3)
├── Aviation Security Co (air assault QRF)
├── Transportation Group (general + armored transport)
└── Brigade Support: Medical, Maintenance, Intelligence, Signal,
    Electronic Warfare, CBRN, EOD, Military Police</div></div>`, 'wide');
  $('#b-x', m).onclick = closeModal;
}

// ------------------------------------------------------------- title
function titleMap() {
  let s = `<svg class="t-map" viewBox="0 0 ${MD.W} ${MD.H}" aria-hidden="true"><defs><radialGradient id="tg"><stop offset="0" stop-color="#e2483b" stop-opacity=".9"/><stop offset="1" stop-color="#e2483b" stop-opacity="0"/></radialGradient></defs><path d="${MD.grat}" fill="none" stroke="#172429" stroke-width=".6"/>`;
  const hot = { WAF:.8, CAF:.6, NAF:.35, EAF:.5, MDE:.25, SEU:.15, SAF:.2 };
  for (const r of E.REGIONS) s += `<path d="${MD.regions[r.id].d}" fill="${hot[r.id] ? infColor(hot[r.id] * .2) : '#1d2b2a'}" stroke="#0c1316" stroke-width=".6"/>`;
  for (const [id, v] of Object.entries(hot)) { const [x, y] = E.RD[id].a; s += `<circle cx="${x}" cy="${y}" r="${30 * v + 10}" fill="url(#tg)" opacity=".5"/>`; }
  return s + '</svg>';
}
function showTitle() {
  closeModal(); const sv = get(SAVE_KEY); const mt = meta();
  const hardOK = mt.maxWeeks >= 20;
  if (titleOpts.cmd === 'hard' && !hardOK) titleOpts.cmd = 'mech';
  $('#root').innerHTML = `<div class="title"><div class="title-in">
    <div class="t-hero"><div><div class="t-logo">ECB<span>OUTBREAK</span></div>
      <p class="t-tag">A plague is loose and the dead are walking. You command the <b>Expeditionary Combat Brigade</b>: 4,800 soldiers, a fleet of modular combat vehicles, eleven helicopters and a drone squadron. Draw orders, make hard calls, and hold the world together until the labs finish a cure.</p>
      <div class="t-go">${sv && !sv.over ? `<button class="btn" id="t-cont">Continue week ${sv.turn}</button>` : ''}<button class="btn ${sv && !sv.over ? 'ghost' : ''}" id="t-start">${sv && !sv.over ? 'New run' : 'Start run'}</button><button class="btn ghost" id="t-how">How to play</button><button class="btn ghost" id="t-film">Watch intro</button></div>
      <label class="t-chk" for="t-intro"><input type="checkbox" id="t-intro" ${introOn() ? 'checked' : ''}> Play the opening cinematic when a run starts</label></div>
      <div>${titleMap()}</div></div>
    <div class="t-sec"><h3>Choose your commander</h3><div class="cmds">${E.COMMANDERS.map(c => { const locked = c.unlock && !hardOK; return `<button class="cmd" data-c="${c.id}" aria-pressed="${titleOpts.cmd === c.id}" ${locked ? 'disabled' : ''}><span class="tt">${esc(c.title)}</span><span class="nm">${esc(c.name)}</span><span class="bl">${esc(locked ? 'Locked. ' + c.unlock + ' to unlock.' : c.blurb)}</span></button>`; }).join('')}</div></div>
    <div class="t-sec t-row"><label><span class="lbl">Difficulty</span><div class="seg" id="t-diff">${Object.entries(E.DIFFS).map(([k, d]) => `<button data-d="${k}" aria-pressed="${titleOpts.diff === k}">${d.name}</button>`).join('')}</div></label>
      <label for="t-seed"><span class="lbl">Seed (optional)</span><input id="t-seed" placeholder="random" value="${esc(titleOpts.seed)}" maxlength="16" autocomplete="off"></label></div>
    <div class="note" id="t-diffnote" style="margin-top:8px"></div>
    <div class="records"><span>Runs <span class="mono">${mt.runs}</span></span><span>Cures found <span class="mono">${mt.wins}</span></span><span>Best score <span class="mono">${mt.best.toLocaleString()}</span></span><span>Longest run <span class="mono">${mt.maxWeeks} weeks</span></span></div>
  </div></div>`;
  const notes = { recruit:'Recruit: start here. Slower pathogen, stronger resupply, faster labs.', veteran:'Veteran: the intended challenge.', nightmare:'Nightmare: two outbreak origins, weak supply lines, faster pathogen. Score ×1.5.' };
  const upd = () => { $('#t-diffnote').textContent = notes[titleOpts.diff]; };
  upd();
  for (const b of $$('.cmd')) b.onclick = () => { titleOpts.cmd = b.dataset.c; for (const x of $$('.cmd')) x.setAttribute('aria-pressed', x === b); };
  for (const b of $$('#t-diff button')) b.onclick = () => { titleOpts.diff = b.dataset.d; for (const x of $$('#t-diff button')) x.setAttribute('aria-pressed', x === b); upd(); };
  $('#t-seed').oninput = e => titleOpts.seed = e.target.value.trim();
  $('#t-start').onclick = () => startGame({ cmd:titleOpts.cmd, diff:titleOpts.diff, seed:titleOpts.seed || undefined });
  $('#t-how').onclick = showHowTo;
  $('#t-intro').onchange = e => { try { localStorage.setItem('ecb_intro', e.target.checked ? '1' : '0'); } catch (x) {} };
  $('#t-film').onclick = () => { const demo = E.newGame({ cmd:titleOpts.cmd, diff:titleOpts.diff, seed:titleOpts.seed || undefined }); CINE.play(demo, showTitle); };
  const c = $('#t-cont'); if (c) c.onclick = () => { S = E.migrate(sv); enterGame(); };
}
function introOn() { try { return localStorage.getItem('ecb_intro') !== '0'; } catch (e) { return true; } }
function startGame(opts) { S = E.newGame(opts); pendingSitrep = null; sel = null; tab = 'brigade'; view = { x:0, y:0, w:MD.W, h:MD.H }; closeModal(); if (introOn() && !opts.noIntro) CINE.play(S, enterGame); else enterGame(); }
function enterGame() { closeModal(); shell(); flow(); }

// ------------------------------------------------------------- keys
document.addEventListener('keydown', e => {
  if (CINE.active()) { if (e.key === 'Escape' || e.key === 'Enter' || e.key === ' ') { e.preventDefault(); CINE.stop(); } return; }
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
  const m = $('#modal');
  if (m) { if (m._key && /^([1-9]|Enter| )$/.test(e.key)) { e.preventDefault(); m._key(e.key); } if (e.key === 'Escape' && !S?.crisis && !S?.pendingReward && !pendingSitrep && !(S && S.over)) closeModal(); return; }
  if (!S || !$('#app')) return;
  if (/^[1-9]$/.test(e.key)) { const i = +e.key - 1; const cards = $$('#hand .card'); if (cards[i]) playIdx(i, cards[i]); }
  else if (e.key === 'e' || e.key === 'E') doEndTurn();
  else if ((e.key === 'a' || e.key === 'A') && !S.over) showAirTasking();
  else if ((e.key === 'g' || e.key === 'G') && !S.over) showEngineers();
});
let rt = null; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (S && $('#app')) renderMap(); }, 120); });

// ------------------------------------------------------------- boot (with live-update support)
try { window.claude?.hot?.snapshot?.(() => ({ S, sel, tab, inGame: !!$('#app') })); } catch (e) {}
try { if (!document.getElementById('art-sprite')) document.body.insertAdjacentHTML('afterbegin', ART.sprite()); } catch (e) {}
function boot(data) {
  if (data && data.S && data.inGame) { S = E.migrate(data.S); sel = data.sel || null; tab = data.tab || 'brigade'; enterGame(); }
  else showTitle();
}
try { window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {}); } catch (e) { boot({}); }
window.__ECB = { get S() { return S; }, E, flow: () => flow() };
})();

</script>
